---
- hosts: all
  pre_tasks:

  - name: Update repo for ubuntu
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"
    tags: always

  - name: Update repo for centos
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "RedHat"
    tags: always

- hosts: web
  gather_facts: false
  tasks:

    - name: Install unzip package
      package:
        name: unzip
        state: latest
      tags: tf

    - name: Download Terraform
      command: >
        curl -L
        https://releases.hashicorp.com/terraform/1.15.6/terraform_1.15.6_linux_amd64.zip
        -o /tmp/terraform.zip
      tags: test

    - name: Extract Terraform
      unarchive:
        src: /tmp/terraform.zip
        dest: /usr/local/bin
        remote_src: yes
      tags: test

- hosts: web
  tasks:

    - name: Install apache and php
      dnf:
        name:
          - httpd
          - php
        state: present
      tags: web

    - name: Start apache service (CentOS)
      tags: web
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Change email
      tags: web
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^ServerAdmin'
        line: 'ServerAdmin saifomran22@gmail.com'
      register: httpd

    - name: Restart apache service
      tags: web
      service:
        name: httpd
        state: restarted
      when: httpd.changed
    
    - name: Copy site file to the web server
      copy:
        src: default_site.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: 0644
      tags: web

- hosts: db
  gather_facts: false
  tasks:

    - name: Install MariaDB
      apt:
        name: mariadb-server
        state: latest
      when: ansible_distribution == "Ubuntu"
      tags: db


